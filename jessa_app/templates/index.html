<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JESSA</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="brand">JESSA</div>
        <div class="meta">v{{ version }} · {{ model }} · {{ email_user or "email not configured" }}</div>
      </div>
      <nav class="tabs" aria-label="Views">
        <button class="tab hidden" data-tab="setup" id="setup-tab">Setup</button>
        <button class="tab active" data-tab="jobs">Jobs</button>
        <button class="tab" data-tab="profile">Core Profile</button>
        <button class="tab" data-tab="email">Email</button>
      </nav>
    </header>

    <main class="view" id="setup-view">
      <section class="setup-shell">
        <div class="setup-header">
          <h1>Setup</h1>
          <span id="setup-status"></span>
        </div>
        <div class="setup-grid" id="setup-content"></div>
      </section>
    </main>

    <main class="view active" id="jobs-view">
      <section class="import-band">
        <input id="job-url" type="url" placeholder="Job URL" />
        <select id="import-method">
          <option value="http">HTTP</option>
          <option value="linkedin">LinkedIn</option>
          <option value="playwright">Rendered</option>
        </select>
        <button id="import-url">Import</button>
        <button id="toggle-text-import">Text</button>
      </section>
      <section class="text-import hidden" id="text-import">
        <textarea id="job-text" placeholder="Paste job text"></textarea>
        <button id="import-text">Import Text</button>
      </section>
      <section class="workspace">
        <aside class="job-sidebar">
          <div class="job-view-tabs" aria-label="Job lifecycle views">
            <button class="job-view-tab active" data-job-view="active">ACTIVE</button>
            <button class="job-view-tab" data-job-view="archived">ARCHIVED</button>
            <button class="job-view-tab" data-job-view="trash">TRASH BIN</button>
          </div>
          <div class="job-list-tools">
            <label class="status-filter" id="status-filter-shell">
              <span>Status</span>
              <select id="job-status-filter"></select>
            </label>
            <div class="bulk-actions" id="bulk-actions">
              <div class="bulk-count" id="bulk-count">0 selected</div>
              <div class="bulk-row">
                <button id="select-visible-jobs">Select Visible</button>
                <button id="clear-selected-jobs">Clear</button>
              </div>
              <div class="bulk-row" id="bulk-status-row">
                <select id="bulk-status"></select>
                <button id="bulk-update-status">Update Status</button>
              </div>
              <div class="bulk-row">
                <button id="bulk-trash" class="danger">Move to Trash</button>
                <button id="bulk-recover" class="hidden">Recover</button>
              </div>
            </div>
          </div>
          <div class="job-list" id="job-list"></div>
        </aside>
        <section class="job-detail" id="job-detail">
          <div class="empty-state">Select or import a job.</div>
        </section>
      </section>
    </main>

    <main class="view" id="profile-view">
      <section class="editor-shell">
        <div class="editor-header">
          <div>
            <h1>Core Profile</h1>
            <span id="profile-version"></span>
          </div>
          <button id="save-profile">Save</button>
        </div>
        <section class="profile-import-panel hidden" id="profile-import-panel">
          <div class="section-title-row">
            <div>
              <h2>Profile Import</h2>
              <span id="profile-import-status"></span>
            </div>
            <div class="linkedin-profile-actions">
              <select id="profile-import-mode">
                <option value="append">Append</option>
                <option value="replace">Replace starter profile</option>
              </select>
              <button id="import-profile">Import</button>
            </div>
          </div>
          <input id="profile-import-file" type="file" accept=".txt,.md,.markdown,.json,.csv,.html,.htm,.pdf,text/*,application/pdf" />
          <textarea id="profile-import-text" placeholder="Paste resume, profile, or career notes"></textarea>
        </section>
        <section class="linkedin-profile-panel">
          <div class="section-title-row">
            <div>
              <h2>LinkedIn Profile</h2>
              <span id="linkedin-profile-status"></span>
            </div>
            <div class="linkedin-profile-actions">
              <button id="fetch-linkedin-profile">Cache from URL</button>
              <button id="save-linkedin-profile">Save Cache</button>
            </div>
          </div>
          <input id="linkedin-profile-url" type="url" placeholder="https://www.linkedin.com/in/..." />
          <input id="linkedin-profile-title" placeholder="Profile title" />
          <textarea id="linkedin-profile-cache" placeholder="Paste the candidate's LinkedIn profile text or cache it from the URL"></textarea>
        </section>
        <textarea id="profile-editor"></textarea>
      </section>
    </main>

    <main class="view" id="email-view">
      <section class="email-actions">
        <button id="sync-email">Sync Inbox</button>
        <button id="test-email">Test SMTP</button>
        <span id="email-status"></span>
      </section>
      <section class="email-list" id="email-list"></section>
    </main>

    <div class="toast hidden" id="toast"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
